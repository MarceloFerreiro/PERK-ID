[features]
enabled = ["SIFT"]#, "GLCM", "HU_MOMENTS", "LBP",]

[features.GLCM]
levels = 32
distances = [1]
angles = [0, 0.7854, 1.5708, 2.3562]  # [0, π/4, π/2, 3π/4]
symmetric = true
normed = true

[features.HU_MOMENTS]

[features.LBP]
radius = 3
n_points = 24
bins = 59
method = "uniform"

[features.HIST]
bins = 20

[features.SIFT]
# https://scikit-image.org/docs/stable/api/skimage.feature.html#skimage.feature.SIFT
n_octaves = 6
n_bins = 40
n_hist = 8

[features.ORB]
# https://scikit-image.org/docs/stable/api/skimage.feature.html#skimage.feature.ORB
n_features = 500
scale_factor = 1.2
n_levels = 8

[transform]
# calibrado — combo_search α=0.4414, Top-1=0.71 Top-10=0.93
scale_min        = 0.8749
scale_max        = 1.1251
rotation_deg     = 19.8633
shear_deg        = 14.3457
translation_px   = 35.3125
noise_prob       = 0.4414
noise_amount_min = 0.0044
noise_amount_max = 0.0087
blur_prob        = 0.4414
blur_radius_min  = 0.1835
blur_radius_max  = 0.3671
jitter_prob      = 0.4414
jitter_min       = 0.8315
jitter_max       = 1.1685

[features.bow]
n_clusters = 500

[ranker]
# https://scikit-learn.org/stable/modules/metrics.html
#
#  {'infinity', 'canberra', 'hamming', 'p', 'cityblock', 
#  'braycurtis', 'sokalsneath', 'cosine', 'nan_euclidean', 
#  'dice', 'correlation', 'precomputed', 'seuclidean', 
#  'chebyshev', 'rogerstanimoto', 'jaccard', 'haversine', 
#  'sokalmichener', 'yule', 'sqeuclidean', 'manhattan', 'l1', 
#  'russellrao', 'minkowski', 'l2', 'pyfunc', 'mahalanobis', 'euclidean'}
metric = 'cosine'
n_neighbors = 10
