[features]
enabled = ["SIFT", "GLCM", "HU_MOMENTS", "LBP",]

[features.GLCM]
levels = 32
distances = [1]
angles = [0, 0.7854, 1.5708, 2.3562]  # [0, π/4, π/2, 3π/4]
symmetric = true
normed = true

[features.HU_MOMENTS]

[features.LBP]
radius = 3
n_points = 24
bins = 59
method = "uniform"

[features.HIST]
bins = 20

[features.SIFT]
# https://scikit-image.org/docs/stable/api/skimage.feature.html#skimage.feature.SIFT
n_octaves = 6
n_bins = 40
n_hist = 6

[features.ORB]
# https://scikit-image.org/docs/stable/api/skimage.feature.html#skimage.feature.ORB
n_features = 500
scale_factor = 1.2
n_levels = 8

[transform]
scale_min = 0.7
scale_max = 1.3
rotation_deg = 25.0
shear_deg = 15.0
translation_px = 10.0
noise_prob = 0.5
noise_amount_min = 0.001
noise_amount_max = 0.02
blur_prob = 0.4
blur_radius_min = 0.5
blur_radius_max = 2.0
jitter_prob = 0.8
jitter_min = 0.7
jitter_max = 1.3

[features.bow]
n_clusters = 250

[ranker]
# https://scikit-learn.org/stable/modules/metrics.html
#
#  {'infinity', 'canberra', 'hamming', 'p', 'cityblock', 
#  'braycurtis', 'sokalsneath', 'cosine', 'nan_euclidean', 
#  'dice', 'correlation', 'precomputed', 'seuclidean', 
#  'chebyshev', 'rogerstanimoto', 'jaccard', 'haversine', 
#  'sokalmichener', 'yule', 'sqeuclidean', 'manhattan', 'l1', 
#  'russellrao', 'minkowski', 'l2', 'pyfunc', 'mahalanobis', 'euclidean'}
metric = 'cosine'
n_neighbors = 10
